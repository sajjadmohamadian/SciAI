services:
  - type: web
    name: sciai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SCIAI_PUBLIC_UPLOADS
        value: "true"
      - key: SCIAI_API_TOKEN
        generateValue: true
